name: Backend CI

on:
  push:
    branches: [main, bingo-security-hardening]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bingo_user
          POSTGRES_PASSWORD: bingo_test_pass
          POSTGRES_DB: bingo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bingo_user -d bingo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bingo_user:bingo_test_pass@localhost:5432/bingo_test
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm test
